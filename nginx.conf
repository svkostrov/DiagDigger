server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OMV may mount the repository: expose only the application's public files.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(index\.html|app\.js|parser\.js|styles\.css|semantic\.css|netcraze\.css|themes\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        return 404;
    }
}
